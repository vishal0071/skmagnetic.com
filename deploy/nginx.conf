# nginx for the static SK Enterprises site. TLS, HSTS, security headers and
# compression are handled by Traefik in front of this container.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    # Published site — /srv/site/current is a symlink switched atomically by the admin service
    root /srv/site/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Behind Traefik: keep redirects relative so they stay on https://<domain>/
    absolute_redirect off;

    # Content-hashed build assets (CSS, JS, fonts, optimised images) — cache forever
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Icons, brand files, social image, documents
    location ~* \.(?:png|jpe?g|webp|avif|gif|svg|ico|woff2?|pdf|webmanifest)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Pages: /about → 301 /about/  ·  /about/ → /about/index.html
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
